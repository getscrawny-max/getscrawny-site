<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plant Lyfe | Get Scrawny Arcade</title>
    <meta name="description" content="A cozy idle plant growing and selling game in Get Scrawny Arcade.">
    <link rel="preload" href="styles.css?v=manbow-library-2" as="style">
    <link rel="stylesheet" href="styles.css?v=manbow-library-2">
  </head>
  <body class="plantlyfe-body">
    <header class="site-header" data-header>
      <a class="brand" href="index.html#top" aria-label="Get Scrawny home">
        <img class="brand-logo" src="assets/NEW_GS_LogoBlueCrop.PNG" alt="Get Scrawny">
      </a>

      <nav class="primary-nav" aria-label="Main navigation">
        <a class="home-link" href="index.html#top">Home</a>
        <a class="home-link" href="lessons.html">Library</a>
        <a class="home-link" href="arcade.html" aria-current="page">Arcade</a>
      </nav>

    </header>

    <main class="plantlyfe-page arcade-page" id="top">
      <section class="plantlyfe-hero" aria-labelledby="plantlyfe-title">
        <h1 id="plantlyfe-title">Plant Lyfe</h1>
        <p>Grow starter plants, move mature stock to the display shelf, and sell to customers while your shop slowly levels up.</p>
      </section>

      <section class="plantlyfe-shell" aria-label="Plant Lyfe game" data-plantlyfe-shell>
        <div class="plantlyfe-hud" aria-label="Plant Lyfe controls">
          <div class="plantlyfe-hud-brand">
            <strong>Plant Lyfe</strong>
          </div>
          <div class="plantlyfe-hud-stats" aria-label="Plant Lyfe status">
            <div class="plantlyfe-hud-chip plantlyfe-hud-user">▶ <span data-plantlyfe-mirror="user">—</span></div>
            <div class="plantlyfe-hud-chip"><span>Money</span> $<strong data-plantlyfe-mirror="money">0</strong></div>
            <div class="plantlyfe-hud-chip"><span>Rep</span> ★<strong data-plantlyfe-mirror="rep">0</strong></div>
            <div class="plantlyfe-rep-rail" aria-label="Rank progress">
              <span data-plantlyfe-mirror="rank">Sprout</span>
              <div><i data-plantlyfe-mirror="rep-fill"></i></div>
              <span data-plantlyfe-mirror="rep-next">0/10</span>
            </div>
            <div class="plantlyfe-hud-chip"><span>Sold</span> <strong data-plantlyfe-mirror="sold">0</strong></div>
            <button type="button" class="plantlyfe-hud-action" data-plantlyfe-proxy="encyclopedia-btn">Plants <span data-plantlyfe-mirror="plants">0/0</span></button>
            <button type="button" class="plantlyfe-hud-action" data-plantlyfe-proxy="pause-btn" data-plantlyfe-mirror="pause">Pause</button>
            <button type="button" class="plantlyfe-hud-action" data-plantlyfe-proxy="logout-btn">Logout</button>
          </div>
          <div class="plantlyfe-hud-actions" aria-label="Plant Lyfe view controls">
            <button type="button" class="plantlyfe-icon-button" data-plantlyfe-zoom-out aria-label="Zoom game out">−</button>
            <button type="button" class="plantlyfe-icon-button" data-plantlyfe-zoom-in aria-label="Zoom game in">+</button>
            <button type="button" class="plantlyfe-icon-button plantlyfe-fullscreen-button" data-plantlyfe-fullscreen aria-label="Toggle fullscreen">
              <img src="assets/fullscreen.png" alt="" aria-hidden="true">
            </button>
          </div>
        </div>
        <div class="plantlyfe-stage" data-plantlyfe-stage>
          <iframe
            title="Plant Lyfe idle plant shop game"
            src="plant-lyfe-v4/index.html?v=plant-lyfe-panel-art-clarity-1&embedded=1"
            loading="eager"
            allow="fullscreen"
            data-plantlyfe-frame></iframe>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>Get Scrawny LLC</p>
      <p>Plant Lyfe idle shop play for planning and patient progression.</p>
    </footer>

    <script src="script.js?v=plant-lyfe-session-hud-1"></script>
  </body>
</html>
